name: aura_audio
description: A private, fully offline Android music player.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/fonts/OFL-Jakarta.txt
    - assets/fonts/OFL-Mono.txt
    - assets/fonts/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
